<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A birthday, for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a1f2e;--accent:#c2185b;--muted:#8a5a68;--s1a:#fff3ea;--s1b:#ffd9d6;--glow:rgba(255,70,120,.28);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f7d3dd;--accent:#ff7aa8;--muted:#cfa0b0;--s1a:#2a1220;--s1b:#4a1a33;--glow:rgba(255,90,140,.3)}}
:root[data-theme="dark"]{--ink:#f7d3dd;--accent:#ff7aa8;--muted:#cfa0b0;--s1a:#2a1220;--s1b:#4a1a33;--glow:rgba(255,90,140,.3)}
html,body{height:100%;margin:0;background:#0d0510}
body{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;overflow:hidden}
#app{position:relative;width:min(100vw,440px);height:100%;margin:0 auto;overflow:hidden}
.sc{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .8s}
.sc.on{opacity:1;pointer-events:auto}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #ffb3c7;outline-offset:3px}
.script{font-family:"Pinyon Script","Snell Roundhand",cursive;font-style:normal}
/* scene 1 */
#s1{background:radial-gradient(ellipse at 50% 28%,var(--glow),transparent 55%),linear-gradient(180deg,var(--s1a),var(--s1b));color:var(--ink)}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.top,.bottom{position:absolute;left:0;right:0;text-align:center;pointer-events:none;transition:opacity .6s}
.top{top:7%;font-size:21px}.bottom{bottom:6%;font-size:19px;color:var(--muted)}
#wish{position:absolute;left:0;right:0;top:40%;text-align:center;padding:0 24px;opacity:0;pointer-events:none;transition:opacity .9s .5s}
#wish .big{font-size:56px;color:var(--accent);line-height:1.1}
#wish .nm{font-size:30px;margin-top:6px}
#s1.hit #wish{opacity:1}#s1.hit .top,#s1.hit .bottom{opacity:0}
.pill{border:1px solid var(--accent);background:transparent;color:inherit;font-size:20px;padding:.5em 1.4em;border-radius:999px}
#toLetter{position:absolute;left:50%;transform:translateX(-50%);bottom:7%;opacity:0;pointer-events:none;transition:opacity .6s 1.3s}
#s1.hit #toLetter{opacity:1;pointer-events:auto}
/* scene 2 */
#s2{background:radial-gradient(ellipse at 50% 45%,#4a0b24,#14040d 70%);color:#f7d3dd}
.petal{position:absolute;top:-20px;width:10px;height:14px;border-radius:60% 0 60% 0;background:#b0123f;opacity:.7;animation:fall linear infinite}
@keyframes fall{to{transform:translate(40px,110vh) rotate(360deg)}}
#s2 .t{position:absolute;top:20%;left:0;right:0;text-align:center}
#s2 .t .script{font-size:38px;color:#e8c872}
#s2 .t div+div{font-size:15px;letter-spacing:.12em;color:#b98a98;margin-top:6px}
#env{position:absolute;left:7%;right:7%;top:36%;aspect-ratio:1.6;background:linear-gradient(160deg,#a3123a,#74092a);box-shadow:0 20px 40px rgba(0,0,0,.5);transition:transform .9s .5s,opacity .7s .7s}
#env::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#a8143c 50%,transparent 50%),linear-gradient(225deg,#a8143c 50%,transparent 50%);clip-path:polygon(0 0,50% 50%,100% 0,100% 100%,0 100%);opacity:.5}
#flap{position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(180deg,#c61b49,#a31239);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s}
#seal{position:absolute;left:50%;top:calc(36% + var(--w)*.312);width:72px;height:72px;margin:-36px 0 0 -36px;padding:0;border:0;border-radius:50%;background:radial-gradient(circle at 32% 26%,#ff8fb0 0,#e0245e 26%,#a60f3f 62%,#6a0524 100%);color:#ffe3ec;font-size:30px;line-height:72px;text-shadow:0 -1px 0 rgba(255,255,255,.5),0 2px 2px rgba(0,0,0,.5);box-shadow:0 8px 16px rgba(0,0,0,.55),inset 0 2px 3px rgba(255,255,255,.45),inset 0 -5px 9px rgba(0,0,0,.45),0 0 26px rgba(255,60,110,.4);animation:beat 1.8s infinite;z-index:2}
#seal::before{content:"";position:absolute;inset:7px;border-radius:50%;border:1.5px dashed rgba(255,222,232,.7)}
#seal::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,140,175,.7);animation:rip 1.8s infinite}
@keyframes rip{from{transform:scale(1);opacity:.7}to{transform:scale(1.9);opacity:0}}
@media (prefers-reduced-motion:reduce){#seal::after{animation:none;opacity:0}}
@keyframes beat{50%{transform:scale(1.08)}}
#s2 .h{position:absolute;top:calc(36% + 62vw*0 + 300px);}
#hint2{position:absolute;left:0;right:0;top:calc(36% + var(--w)*.54 + 18px);text-align:center;font-size:18px;color:#b98a98;transition:opacity .4s}
#s2.open #env{transform:translateY(120px);opacity:0}
#s2.open #flap{transform:rotateX(180deg)}
#s2.open #seal,#s2.open #hint2{opacity:0;pointer-events:none}
#letter{position:absolute;left:6%;right:6%;top:43%;transform:translateY(-50%) scale(.94);opacity:0;pointer-events:none;transition:opacity .7s 1s,transform .7s 1s}
#s2:not(.open) #letter{transition:opacity .4s,transform .4s}
#card{position:relative;z-index:1;background:#fff8f4;color:#4a1f2e;border-radius:14px;padding:14px 22px 18px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
#s2.open #letter{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
#pg{font-size:13px;letter-spacing:.14em;color:#8a5a68;text-align:center}
#lt{min-height:200px;transition:opacity .25s}
#lt h2{font-family:"Pinyon Script",cursive;font-style:normal;font-weight:400;font-size:38px;color:#8e0f33;margin:10px 0 6px}
#lt p{font-size:19px;line-height:1.45;margin:0 0 10px;font-style:normal}
#lt .sg{margin-top:14px;text-align:right;font-size:18px;color:#8a5a68}
#lt .sg b{display:block;font-family:"Pinyon Script",cursive;font-weight:400;font-size:32px;color:#8e0f33}
.nav{display:flex;justify-content:space-between;gap:8px}
.nav button{border:1px solid #e8b8c6;background:#fff;color:#8e0f33;border-radius:999px;padding:.4em 1em;font-size:17px}
.nav #nx{background:#b3163f;color:#fff;border-color:#b3163f}
.nav button[disabled]{opacity:.35}
#mini{position:absolute;right:8%;bottom:-92px;z-index:0;width:112px;padding:7px 7px 9px;background:#fffaf5;border:0;border-radius:6px;box-shadow:0 10px 24px rgba(0,0,0,.55);transform:translateY(-70px) rotate(7deg);pointer-events:none;transition:transform .8s 1.8s;color:#4a1f2e;text-align:center}
#s2.open #mini{pointer-events:auto;transform:rotate(7deg)}
.ph{display:block;position:relative;background:linear-gradient(135deg,#f6c6d2,#e8869f) center/cover}
.ph::after{content:"\2665";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);font-size:26px;font-style:normal}
.ph.has::after{content:none}
#mini .ph{height:78px}
#mini .c{display:block;font-size:12px;margin-top:5px}
#strip{position:absolute;inset:0;background:rgba(10,2,6,.6);display:none;overflow-y:auto;padding:5vh 0;z-index:5}
#strip.show{display:flex}
#sx{position:absolute;top:12px;right:16px;background:none;border:0;color:#fff;font-size:34px;line-height:1}
.roll{width:min(62%,260px);margin:auto;background:#fffaf5;color:#4a1f2e;padding:12px 12px 14px;border-radius:6px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.7)}
.roll h3{font-size:16px;letter-spacing:.1em;margin:2px 0 10px;font-weight:500}
.roll .ph{height:min(21vh,160px)}
.roll figure{margin:0 0 10px}
.roll figcaption{font-size:18px;margin-top:5px}
.roll .ft{font-size:13px;color:#8a5a68;margin-top:2px}
.bar{height:20px;margin-top:8px;background:repeating-linear-gradient(90deg,#4a1f2e 0 2px,transparent 2px 4px,#4a1f2e 4px 5px,transparent 5px 8px)}
.lh{display:flex;align-items:center;justify-content:space-between;border-bottom:1px dotted #e3bcc8;padding-bottom:6px}
.hrt{color:#b3163f;font-size:15px;font-style:normal}
#lx{background:none;border:0;color:#8a5a68;font-size:28px;line-height:1;padding:0 2px}
#mini .d{display:block;font-size:9px;letter-spacing:.1em;color:#8a5a68;margin-top:4px;font-style:normal}
#mini .bar{height:9px;margin-top:4px}
.roll{position:relative}
.roll::before{content:"";position:absolute;left:50%;top:-9px;width:50px;height:16px;margin-left:-25px;background:rgba(232,215,180,.92);transform:rotate(-1.5deg)}
#s2{--w:min(100vw,440px)}
#mini2{position:absolute;left:8%;bottom:-80px;z-index:0;width:112px;padding:7px 7px 9px;background:#fffaf5;border:0;border-radius:6px;box-shadow:0 10px 24px rgba(0,0,0,.55);transform:translateY(-70px) rotate(-6deg);pointer-events:none;transition:transform .8s 2.1s;color:#4a1f2e;text-align:center}
#s2.open #mini2{pointer-events:auto;transform:rotate(-6deg)}
#mini2 .ph{height:78px}
#mini2 .c{display:block;font-size:12px;margin-top:5px}
#mini2 .d{display:block;font-size:9px;letter-spacing:.1em;color:#8a5a68;margin-top:4px;font-style:normal}
#mini2 .bar{height:9px;margin-top:4px}
@media (max-height:620px){#lt{min-height:0}#lt p{font-size:16px;margin-bottom:6px}#lt h2{font-size:30px;margin:6px 0 4px}#lt .sg{margin-top:8px}}
#mini2{left:auto;bottom:auto;right:-18px;top:-10px;width:74%;height:88%;padding:8px;box-sizing:border-box;transform:translateX(-40px) rotate(4deg)}
#s2.open #mini2{transform:rotate(4deg)}
#mini2 .ph{height:100%}
#mini2 .c,#mini2 .d,#mini2 .bar{display:none}
#mini2::before{content:"";position:absolute;left:58%;top:-9px;width:46px;height:15px;background:rgba(232,215,180,.92);transform:rotate(-3deg)}
.roll .ph{height:auto;aspect-ratio:1.2}
#mini2{top:-24px;right:-16px;width:58%;height:34%;transform:translateX(-40px) rotate(5deg)}
#s2.open #mini2{transform:rotate(5deg)}
#mini{bottom:-132px;width:124px;transform:translateY(-80px) rotate(4deg)}
#s2.open #mini{transform:rotate(4deg)}
#mini .bar{display:block}
#mini .c{font-size:11px;line-height:1.15}
#mini .d{font-size:8px;white-space:nowrap}
/* scene 3 */
#s3{background:linear-gradient(180deg,#1b1a2c,#12111d);color:#f1ece6}
.bl{position:absolute;bottom:-90px;width:34px;height:44px;border-radius:50% 50% 48% 48%;animation:rise linear infinite}
.bl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:50px;background:rgba(255,255,255,.35)}
@keyframes rise{to{transform:translateY(-120vh)}}
.cakeWrap{position:absolute;left:0;right:0;top:34%;display:flex;flex-direction:column;align-items:center}
.cake{position:relative;width:200px;height:150px}
.cake i{position:absolute;display:block}
.l1{bottom:0;left:0;width:200px;height:36px;background:#6f5650}.l2{bottom:36px;left:5px;width:190px;height:36px;background:#8c6f66}.l3{bottom:72px;left:10px;width:180px;height:34px;background:#a5867b}
.fr{bottom:100px;left:10px;width:180px;height:12px;background:#fff6e6;border-radius:8px 8px 0 0}
.fr::after{content:"";position:absolute;left:0;right:0;top:11px;height:14px;background:radial-gradient(circle at 15px 0,#fff6e6 11px,transparent 12px) 0 0/30px 14px repeat-x}
.candle{position:absolute;left:50%;bottom:108px;width:44px;height:78px;margin-left:-22px;border:0;background:transparent;padding:0}
.stick{position:absolute;left:19px;bottom:0;width:6px;height:44px;background:#f4e4c8}
.flame{position:absolute;left:17px;bottom:44px;width:10px;height:18px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:radial-gradient(circle at 50% 70%,#fff6b0,#ffc43d 60%,#ff8a1f);box-shadow:0 0 22px 8px rgba(255,190,70,.45);animation:fl .18s infinite alternate;transition:opacity .4s}
@keyframes fl{to{transform:scale(1.08,.93) rotate(2deg)}}
.cake i,.candle{opacity:0}
.build .l1{animation:drop .7s .5s both}
.build .l2{animation:drop .7s 1.3s both}
.build .l3{animation:drop .7s 2.1s both}
.build .fr{animation:drop .7s 2.9s both}
.build .candle{animation:drop .8s 3.8s both}
@keyframes drop{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:none}}
.candle{pointer-events:none}.ready .candle{pointer-events:auto}
.flame{opacity:0}.ready .flame{opacity:1}
#hint3{opacity:0}.ready #hint3{opacity:1}
.out .flame{opacity:0}
.plate{width:230px;height:3px;background:#fff;margin-top:-1px}
.msg{text-align:center;margin-top:26px}
.msg .script{font-size:52px;color:#f1ece6;line-height:1.1}
.msg div+div{font-size:24px;margin-top:6px;color:#cfc6bd}
#hint3{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-size:19px;color:#a79fb3;transition:opacity .5s}
#cf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@media (prefers-reduced-motion:reduce){.petal,.bl,#seal,.flame{animation:none}.bl{bottom:30%}.build .cake i,.build .candle{animation:none}.cake i,.candle{opacity:1}}
</style>
</head>
<body>
<div id="app">
 <section class="sc on" id="s1">
  <canvas id="c" aria-label="Pull back the bow and release to shoot the arrow at the heart"></canvas>
  <div class="top">a little something for you</div>
  <div class="bottom" id="hint1">pull back and release</div>
  <div id="wish" aria-live="polite"><div class="big script">Happy Birthday</div><div class="nm" id="to1"></div></div>
  <button class="pill" id="toLetter" type="button">Open your letter</button>
 </section>
 <section class="sc" id="s2">
  <div id="petals"></div>
  <div class="t"><div class="script">A letter for you</div></div>
  <div id="env"><div id="flap"></div></div>
  <button id="seal" type="button" aria-label="Open the envelope">&#9829;</button>
  <div id="hint2">tap the seal to open</div>
  <div id="letter" role="dialog" aria-label="Letter"><button id="mini2" type="button" aria-label="Open the photo strip"><span class="ph" id="mph2"></span><span class="c" id="mcap2"></span><span class="d" id="mdt2"></span><span class="bar"></span></button><button id="mini" type="button" aria-label="Open the photo strip"><span class="ph" id="mph"></span><span class="c" id="mcap"></span><span class="d" id="mdt"></span><span class="bar"></span></button>
   <div id="card"><div class="lh"><span class="hrt">&#9829;</span><span id="pg"></span><button id="lx" type="button" aria-label="Close letter">&times;</button></div><div id="lt"></div>
   <div class="nav"><button id="cl" type="button">&#9993; Close</button><button id="nx" type="button">Cut the cake &rarr;</button></div></div>
  </div>
  
  <div id="strip" role="dialog" aria-label="Photo strip"><button id="sx" type="button" aria-label="Close photos">&times;</button><div class="roll"><h3>&#10022; some playback &#10022;</h3><div id="frames"></div><div class="ft" id="ftd"></div><div class="bar"></div></div></div>
 </section>
 <section class="sc" id="s3">
  <div id="bls"></div>
  <div class="cakeWrap">
   <div class="cake"><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="fr"></i>
    <button class="candle" id="candle" type="button" aria-label="Blow out the candle"><span class="stick" style="position:absolute"></span><span class="flame"></span></button></div>
   <div class="plate"></div>
   <div class="msg"><div class="script">happy birthday!</div><div id="to3"></div></div>
  </div>
  <div id="hint3">tap the candle to blow it out</div>
  <canvas id="cf"></canvas>
 </section>
</div>
<script>
(function(){
var q=new URLSearchParams(location.search),to=q.get("to")||"Tama",from=q.get("from")||"Jaminur";
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function $(i){return document.getElementById(i)}
$("to1").textContent=to?"dear "+to:"";$("to3").textContent=to;
var pages=[q.get("p1")||"Another year, and I still think you are one of the best things that happened to the people around you. Today is entirely yours.",
 q.get("p2")||"I hope this year is gentle with you, and generous. May the people you love stay close, and may the things you are working toward finally come together.",
 q.get("p3")||"I don\u2019t know what the year ahead holds, but I know it will be better with you in it. Happy birthday."];
function go(n){var a=document.querySelectorAll(".sc");for(var i=0;i<a.length;i++)a[i].classList.toggle("on",i===n-1);
 if(n===3){var s3=$("s3");s3.classList.add("build");setTimeout(function(){s3.classList.add("ready")},reduce?200:4800)}}

/* ---- scene 1: bow ---- */
var cv=$("c"),ctx=cv.getContext("2d"),W,H,dpr,S,heart,bow,pull=null,arrow=null,parts=[],hit=false,pulse=0,t0=performance.now();
var G=.2,POW=.2,MAXP=150;
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function size(){dpr=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);S=Math.min(W,H)*.1;heart={x:W*.5,y:H*.27};bow={x:W*.22,y:H*.76}}
function hp(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s);ctx.bezierCurveTo(x-1.5*s,y-.1*s,x-.7*s,y-1.1*s,x,y-.35*s);ctx.bezierCurveTo(x+.7*s,y-1.1*s,x+1.5*s,y-.1*s,x,y+s);ctx.closePath()}
function drawHeart(){var s=S*(1+(reduce?0:pulse*.25+Math.sin((performance.now()-t0)/500)*.03));
 var g=ctx.createRadialGradient(heart.x-s*.4,heart.y-s*.5,s*.1,heart.x,heart.y,s*1.6);g.addColorStop(0,"#ff7aa8");g.addColorStop(.5,"#ff2d78");g.addColorStop(1,"#c2185b");
 ctx.save();ctx.shadowColor="rgba(255,45,120,.55)";ctx.shadowBlur=s*1.2;hp(heart.x,heart.y,s);ctx.fillStyle=g;ctx.fill();ctx.restore();
 ctx.beginPath();ctx.ellipse(heart.x-s*.5,heart.y-s*.45,s*.22,s*.13,-.6,0,7);ctx.fillStyle="rgba(255,255,255,.55)";ctx.fill()}
function pv(){if(!pull)return null;var dx=bow.x-pull.x,dy=bow.y-pull.y,l=Math.hypot(dx,dy);if(l>MAXP){dx*=MAXP/l;dy*=MAXP/l;l=MAXP}return{dx:dx,dy:dy,l:l}}
function arrowAt(x,y,a){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.strokeStyle=css("--ink");ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(54,0);ctx.stroke();
 ctx.fillStyle="#e0245e";ctx.beginPath();ctx.moveTo(60,0);ctx.lineTo(50,-5);ctx.lineTo(50,5);ctx.fill();ctx.fillStyle="#ff7aa8";ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-7,-6);ctx.lineTo(4,0);ctx.lineTo(-7,6);ctx.fill();ctx.restore()}
function drawBow(){var v=pv(),ink=css("--ink"),pulling=v&&v.l>4,a=pulling?Math.atan2(v.dy,v.dx):-.7,c=Math.cos(a),s=Math.sin(a);
 ctx.save();ctx.translate(bow.x,bow.y);ctx.rotate(a);ctx.strokeStyle=ink;ctx.lineWidth=3.5;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(-6,-46);ctx.quadraticCurveTo(26,0,-6,46);ctx.stroke();ctx.restore();
 var nx=pulling?bow.x-v.dx:bow.x-6*c,ny=pulling?bow.y-v.dy:bow.y-6*s;
 ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(bow.x-6*c+46*s,bow.y-6*s-46*c);ctx.lineTo(nx,ny);ctx.lineTo(bow.x-6*c-46*s,bow.y-6*s+46*c);ctx.stroke();
 if(pulling){arrowAt(nx,ny,a);aim(v,a)}else if(!arrow&&!hit)arrowAt(nx,ny,a)}
function aim(v,a){var x=bow.x+Math.cos(a)*30,y=bow.y+Math.sin(a)*30,vx=v.dx*POW,vy=v.dy*POW;ctx.fillStyle=css("--accent");
 for(var i=0;i<26;i++){vy+=G;x+=vx;y+=vy;if(i%2===0){ctx.globalAlpha=.5*(1-i/26);ctx.beginPath();ctx.arc(x,y,2.6,0,7);ctx.fill()}}ctx.globalAlpha=1}
function burst(){var n=reduce?18:70;for(var i=0;i<n;i++){var a=Math.random()*6.283,sp=1.5+Math.random()*6;parts.push({x:heart.x,y:heart.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,s:4+Math.random()*7,l:1,c:["#ff2d78","#ff7aa8","#ffb3c7","#e0245e"][i%4]})}}
function step(){if($("s1").classList.contains("on")){ctx.clearRect(0,0,W,H);drawHeart();drawBow();
